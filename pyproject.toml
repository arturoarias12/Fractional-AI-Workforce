[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional-ai-workforce"
version = "0.1.0"
description = "Multi-agent investment-research system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2,<2",
]
quant-demo = [
    "openpyxl>=3.1,<4",
]
fundamental-demo = [
    "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
